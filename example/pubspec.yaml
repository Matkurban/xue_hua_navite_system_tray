name: xue_hua_navite_system_tray_example
description: "Demonstrates how to use the xue_hua_navite_system_tray plugin."
publish_to: 'none'

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  xue_hua_navite_system_tray:
    path: ../
  cupertino_icons: ^1.0.8

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/tray_logo.png
    - assets/icons/menu_star.png
    - assets/icons/menu_folder.png
