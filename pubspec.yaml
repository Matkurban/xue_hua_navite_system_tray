name: xue_hua_navite_system_tray
description: "A full-featured native desktop system tray plugin for Flutter across macOS, Windows, and Linux."
version: 1.0.1
homepage: https://github.com/Matkurban/xue_hua_navite_system_tray
repository: https://github.com/Matkurban/xue_hua_navite_system_tray
issue_tracker: https://github.com/Matkurban/xue_hua_navite_system_tray/issues
topics:
  - system-tray
  - status-bar
  - menu-bar
  - desktop
  - tray

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      linux:
        pluginClass: XueHuaNaviteSystemTrayPlugin
      macos:
        pluginClass: XueHuaNaviteSystemTrayPlugin
      windows:
        pluginClass: XueHuaNaviteSystemTrayPluginCApi
